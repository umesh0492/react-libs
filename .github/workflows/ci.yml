name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write       # upload Pages artifact
  id-token: write    # OIDC token for trusted deployment

jobs:
  # ── 1. Validate ─────────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    env:
      PERF_P95_THRESHOLD: 750
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Global CI Cache (Coverage, Vitest)
        uses: actions/cache@v4
        with:
          path: |
            coverage
            node_modules/.cache/vitest
          key: ${{ runner.os }}-ci-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ci-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-ci-

      - name: Install Dependencies
        run: npm ci

      - name: Type Definitions Check
        run: npx tsc --noEmit

      - name: Lint (Static Analysis & Custom Rules)
        run: npm run lint

      - name: Build Library Package
        run: npm run build

      - name: Check Package Types Matrix (attw)
        run: npx @arethetypeswrong/cli --pack . --ignore-rules no-resolution

      - name: Verify Component Exports
        run: node scripts/check-exports.mjs

      - name: Performance Gate (P95 Enforcement)
        run: npm run perf

      - name: Execute Vitest (Full Test Suite + Coverage)
        run: npm run test

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  # ── 2. Deploy (main only, after CI passes) ──────────────────────────────────
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
